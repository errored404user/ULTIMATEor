[package]
name = "total-agent"
version = "1.75.1"
edition = "2021"
build = "build.rs"
description = "TotalScript Desktop — native Roblox Studio MCP + AgentScript workspace bridge with a workspace window and tray"
license = "GPL-3.0-or-later"
authors = ["TotalScript"]

[[bin]]
name = "total-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sysinfo = { version = "0.32", features = [] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.26"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.20"

glob = "0.3"
regex = "1"

# Desktop window: pure-Rust eframe/egui (glow renderer). Versions match the
# original total-core 1.18 Cargo.lock so `cargo build --release` resolves offline-friendly.
eframe = "0.29"
# Studio viewport snapshots: base64 payload from screen_capture -> PNG/JPEG decode.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
default = []

# Tray icon: Windows + macOS (the only supported platforms).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
