name: ORscript Desktop (Windows build)

on:
  push:
    paths:
      - "ORscript-Desktop/**"
      - ".github/workflows/desktop.yml"
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ORscript-Desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ORscript-Desktop/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build installer + portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ORscript-Desktop-windows
          path: |
            ORscript-Desktop/release/*.exe
            ORscript-Desktop/release/*.blockmap
            ORscript-Desktop/release/latest.yml
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ORscript-Desktop/release/*.exe
            ORscript-Desktop/release/latest.yml
