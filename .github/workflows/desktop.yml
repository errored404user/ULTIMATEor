name: ORscript Desktop (Rust)

on:
  push:
    paths:
      - "ORscript/agent/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# Compiler / test failures are re-emitted as GitHub annotations (::error
# file=…,line=…::…) so they show up on the commit and in the Checks API even
# when the raw log is not reachable.
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ORscript/agent
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ORscript/agent
      - name: Build (release)
        run: |
          set -o pipefail
          (cargo build --release --locked --message-format=short 2>&1 || cargo build --release --message-format=short 2>&1) | tee build.log
      - name: Annotate compiler warnings (dead code)
        if: always()
        run: |
          set +e
          [ -f build.log ] || exit 0
          grep -E '^[^ :]+\.rs:[0-9]+:[0-9]+: warning' build.log | grep -iE 'never used|never read|never constructed|unused|dead_code' | head -60 | while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"; l="${rest%%:*}"; msg="${line#*: }"
            echo "::warning file=ORscript/agent/$f,line=$l::$msg"
          done
          exit 0
      - name: Annotate compiler errors
        if: failure()
        run: |
          set +e
          grep -E '^[^ :]+\.rs:[0-9]+:[0-9]+: error' build.log | head -10 | while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"; l="${rest%%:*}"; msg="${line#*: }"
            echo "::error file=ORscript/agent/$f,line=$l::$msg"
          done
          grep -iE 'error' build.log | grep -vE '^[^ :]+\.rs:[0-9]+:[0-9]+: error' | head -12 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::group::build.log tail"; tail -40 build.log; echo "::endgroup::"
          tail -8 build.log | while IFS= read -r line; do echo "::warning::tail: $line"; done
          exit 0
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --release --locked --message-format=short 2>&1 | tee test.log
      - name: Annotate test failures
        if: failure()
        run: |
          set +e
          [ -f test.log ] || exit 0
          grep -E '^[^ :]+\.rs:[0-9]+:[0-9]+: error' test.log | head -10 | while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"; l="${rest%%:*}"; msg="${line#*: }"
            echo "::error file=ORscript/agent/$f,line=$l::$msg"
          done
          grep -E "^test .* FAILED|panicked at|^---- |^error" test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0
      - name: Smoke test (headless flag parses)
        run: ./target/release/or-core.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: or-core-windows-x64
          path: ORscript/agent/target/release/or-core.exe

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ORscript/agent
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ORscript/agent
      - name: Build (release)
        run: |
          set -o pipefail
          (cargo build --release --locked --message-format=short 2>&1 || cargo build --release --message-format=short 2>&1) | tee build.log
      - name: Annotate compiler warnings (dead code)
        if: always()
        run: |
          set +e
          [ -f build.log ] || exit 0
          grep -E '^[^ :]+\.rs:[0-9]+:[0-9]+: warning' build.log | grep -iE 'never used|never read|never constructed|unused|dead_code' | head -60 | while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"; l="${rest%%:*}"; msg="${line#*: }"
            echo "::warning file=ORscript/agent/$f,line=$l::$msg"
          done
          exit 0
      - name: Annotate compiler errors
        if: failure()
        run: |
          set +e
          grep -E '^[^ :]+\.rs:[0-9]+:[0-9]+: error' build.log | head -10 | while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"; l="${rest%%:*}"; msg="${line#*: }"
            echo "::error file=ORscript/agent/$f,line=$l::$msg"
          done
          grep -iE 'error' build.log | grep -vE '^[^ :]+\.rs:[0-9]+:[0-9]+: error' | head -12 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::group::build.log tail"; tail -40 build.log; echo "::endgroup::"
          tail -8 build.log | while IFS= read -r line; do echo "::warning::tail: $line"; done
          exit 0
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --release --locked --message-format=short 2>&1 | tee test.log
      - name: Annotate test failures
        if: failure()
        run: |
          set +e
          [ -f test.log ] || exit 0
          grep -E '^[^ :]+\.rs:[0-9]+:[0-9]+: error' test.log | head -10 | while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"; l="${rest%%:*}"; msg="${line#*: }"
            echo "::error file=ORscript/agent/$f,line=$l::$msg"
          done
          grep -E "^test .* FAILED|panicked at|^---- |^error" test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0
      - name: Smoke test
        run: ./target/release/or-core --help
      - uses: actions/upload-artifact@v4
        with:
          name: or-core-macos
          path: ORscript/agent/target/release/or-core
