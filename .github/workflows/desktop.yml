          grep -E '^[^ :]+\.rs:[0-9]+:[0-9]+: error' test.plain | head -10 | while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"; l="${rest%%:*}"; msg="${line#*: }"
            echo "::error file=TotalScript/agent/$f,line=$l::$msg"
          done
          grep -E "^test .* FAILED|panicked at|^---- |^error" test.plain | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          tail -6 test.plain | while IFS= read -r line; do echo "::warning::tail: $line"; done
          exit 0
      - name: Smoke test
        run: ./target/release/total-core --help
      - uses: actions/upload-artifact@v4
        with:
          name: total-core-macos
          path: TotalScript/agent/target/release/total-core
