name: ORscript Desktop (Rust)

on:
  push:
    paths:
      - "ORscript/agent/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ORscript/agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ORscript/agent
      - name: Build (release)
        run: cargo build --release --locked || cargo build --release
      - name: Smoke test (headless flag parses)
        run: .\target\release\or-core.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: or-core-windows-x64
          path: ORscript/agent/target/release/or-core.exe

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ORscript/agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ORscript/agent
      - name: Build (release)
        run: cargo build --release --locked || cargo build --release
      - name: Smoke test
        run: ./target/release/or-core --help
      - uses: actions/upload-artifact@v4
        with:
          name: or-core-macos
          path: ORscript/agent/target/release/or-core

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ORscript/agent
    steps:
      - uses: actions/checkout@v4
      - name: System packages (egui/winit + optional GTK tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev \
            libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ORscript/agent
      - name: Build (release, no tray)
        run: cargo build --release --locked || cargo build --release
      - name: Build (release, linux-tray feature)
        run: cargo build --release --features linux-tray
      - name: Smoke test
        run: ./target/release/or-core --help
      - uses: actions/upload-artifact@v4
        with:
          name: or-core-linux-x64
          path: ORscript/agent/target/release/or-core
