<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="90%">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="0.6" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#f6e7bd"/>
      <stop offset="0.28" stop-color="#e9cf85"/>
      <stop offset="0.5" stop-color="#cfa54a"/>
      <stop offset="0.68" stop-color="#e3c173"/>
      <stop offset="0.86" stop-color="#d2a84f"/>
      <stop offset="1" stop-color="#b88a33"/>
    </linearGradient>
    <linearGradient id="goldR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e1b2"/>
      <stop offset="0.45" stop-color="#dbb65c"/>
      <stop offset="1" stop-color="#c0933a"/>
    </linearGradient>
    <linearGradient id="goldTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b35a"/>
      <stop offset="0.5" stop-color="#e9cf86"/>
      <stop offset="1" stop-color="#c79c3f"/>
    </linearGradient>
    <!-- swoosh: the R's leg sweeping down-right, widening, crossing the ring -->
    <path id="swoosh" d="M284 276 C330 318 380 372 468 436 L452 466 C372 426 318 384 262 314 Z"/>
    <mask id="ringOnly">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="254" cy="254" r="166" fill="none" stroke="#fff" stroke-width="40"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- ring -->
  <circle cx="254" cy="254" r="166" fill="none" stroke="url(#gold)" stroke-width="36"/>
  <!-- dark separation where the swoosh crosses the ring (clipped to the ring) -->
  <g mask="url(#ringOnly)">
    <use href="#swoosh" fill="#0a0a0c" stroke="#0a0a0c" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <!-- swoosh tail -->
  <use href="#swoosh" fill="url(#goldTail)"/>
  <!-- the R: thick stem + squared bowl with a small rounded counter -->
  <path fill="url(#goldR)" fill-rule="evenodd" d="
    M202 154 H286 Q318 154 318 186 V252 Q318 284 286 284 H250 V343 H202 Z
    M250 190 V250 H270 Q280 250 280 240 V200 Q280 190 270 190 Z"/>
</svg>
