<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ORscript">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="90%">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="0.6" stop-color="#0f0f10"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#d9b65f"/>
      <stop offset="0.28" stop-color="#f7e8b8"/>
      <stop offset="0.5" stop-color="#d6ae4f"/>
      <stop offset="0.72" stop-color="#b98a2e"/>
      <stop offset="1" stop-color="#eacb7d"/>
    </linearGradient>
    <linearGradient id="goldR" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f3dfa4"/>
      <stop offset="0.45" stop-color="#d9b25a"/>
      <stop offset="0.75" stop-color="#c09234"/>
      <stop offset="1" stop-color="#f1d68c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ring -->
  <circle cx="238" cy="236" r="166" fill="none" stroke="url(#gold)" stroke-width="40"/>
  <!-- tail halo (cuts the ring like the mark) -->
  <path d="M262 258 L300 258 Q405 388 486 455 L458 471 Q368 410 262 258 Z" fill="#0b0b0c" stroke="#0b0b0c" stroke-width="22" stroke-linejoin="round"/>
  <!-- R -->
  <path fill="url(#goldR)" fill-rule="evenodd"
        d="M170 128 H276 C326 128 346 160 346 190 C346 220 328 246 288 254 L274 256 H222 V340 H170 Z
           M222 170 V214 H270 C290 214 300 204 300 192 C300 180 290 170 270 170 Z"/>
  <!-- tail -->
  <path d="M262 258 L300 258 Q405 388 486 455 L458 471 Q368 410 262 258 Z" fill="url(#gold)"/>
  <!-- specular hairline -->
  <path d="M120 150 A152 152 0 0 1 300 86" fill="none" stroke="#fff6d2" stroke-opacity="0.35" stroke-width="4" filter="url(#soft)"/>
</svg>
